services:
  postgres:
    image: postgres:15-alpine
    container_name: siv_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: siv_huehuetenango
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Ejecuta el schema automáticamente al iniciar la primera vez
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: siv_backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: siv_huehuetenango
      DB_PORT: 5432
      JWT_SECRET: super_secret_jwt_key_para_desarrollo_cambiar_en_prod
      PORT: 3000
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: siv_frontend
    ports:
      - "5173:80"
      - "80:80"
    environment:
      # Asumiendo que se configura en Vite para apuntar al backend local en modo prod,
      # o se usa proxy en dev.
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
